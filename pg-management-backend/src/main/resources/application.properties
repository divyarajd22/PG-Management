spring.application.name=pgmanagement
server.port=8080

# ==========================================
# Database Configuration - MS SQL Server (mssql profile)
# ==========================================
# Update databaseName, localhost, username, password as per your SQL Server instance
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=pg_management;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Security & JWT Configuration
# ==========================================
# Secret key must be at least 256 bits (32 bytes) long.
pg.app.jwtSecret=pgManagementSuperSecretKeyForJWTAuthTokenSigningAndSecurityMustBeLongEnoughToPreventWeakKeyError
pg.app.jwtExpirationMs=86400000

# ==========================================
# Predefined Admin Credentials
# ==========================================
pg.admin.email=admin@pg.com
pg.admin.password=admin123
pg.admin.name=System Admin
